[package]
name = "botcage"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "botcage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Peer-to-peer QUIC, so a phone reaches this machine from anywhere without a
# tailnet, an account, or a server of ours. Brings tokio with it — the rest of
# the app stays synchronous and threaded, and only the p2p module is async.
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time"] }

# Hearing what you say on a call, on this machine. whisper.cpp compiled in,
# with the model downloaded on first use — the same bargain botcage already
# makes for a container engine, and the reason a 10 MB app can transcribe
# speech without sending audio to anybody.
whisper-rs = { version = "0.16", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Metal on Apple Silicon: whisper runs on the GPU, which turns a few seconds of
# speech from about a second into about a tenth of one. Linux stays on the CPU,
# where the small English model is still comfortably faster than talking.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
