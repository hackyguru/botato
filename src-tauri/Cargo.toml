[package]
name = "botcage"
version = "0.4.0"
description = "A cage for your everyday AI bots"
authors = ["Kumaraguru Thambidurai"]
license = "Apache-2.0"
repository = "https://github.com/hackyguru/botcage"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "botcage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Peer-to-peer QUIC, so a phone reaches this machine from anywhere without a
# tailnet, an account, or a server of ours. Brings tokio with it — the rest of
# the app stays synchronous and threaded, and only the p2p module is async.
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time"] }

# Hearing what you say on a call, on this machine. whisper.cpp compiled in,
# with the model downloaded on first use — the same bargain botcage already
# makes for a container engine, and the reason a 10 MB app can transcribe
# speech without sending audio to anybody.
whisper-rs = { version = "0.16", default-features = false }
chacha20poly1305 = "0.10"
argon2 = "0.5"
tar = "0.4"
flate2 = "1"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
# ES256 for the APNs bearer token, and nothing else: no PEM-less builds, no
# aws-lc, no TLS stack. `rust_crypto` keeps it to pure Rust, which keeps the
# binary small and the build honest on both platforms.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["use_pem", "rust_crypto"] }
tauri-plugin-deep-link = "2.4.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The webview itself, on Linux only, and only to answer one question it asks.
# WebKitGTK hands microphone requests to whoever embedded it, wry does not
# implement that for GTK, and WebKit denies anything nobody answered — so
# without this a call on Linux cannot hear. Pinned to the version tauri uses so
# the WebView handed back is the same type.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

# Metal on Apple Silicon: whisper runs on the GPU, which turns a few seconds of
# speech from about a second into about a tenth of one. Linux stays on the CPU,
# where the small English model is still comfortably faster than talking.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
