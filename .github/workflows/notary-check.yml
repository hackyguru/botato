# Temporary. Notarisation fails with a bare 401 that names no field, and burning
# a six-minute build to learn nothing is a poor way to find out which of three
# credentials is wrong. This asks Apple directly and reports the shape of each
# secret without printing any of them.
name: Notary check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Shape of each credential
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shape () {
            name="$1"; value="$2"
            printf '  %-16s length=%s' "$name" "${#value}"
            case "$value" in
              *" "*)  printf ' CONTAINS-SPACE' ;;
            esac
            # A trailing newline is invisible in the UI and fatal here.
            [ "$value" != "$(printf '%s' "$value" | tr -d '\n\r')" ] && printf ' CONTAINS-NEWLINE'
            printf '\n'
          }
          shape APPLE_ID "$APPLE_ID"
          shape APPLE_PASSWORD "$APPLE_PASSWORD"
          shape APPLE_TEAM_ID "$APPLE_TEAM_ID"

          echo "  APPLE_ID looks like an email: $(printf '%s' "$APPLE_ID" | grep -qE '^[^@]+@[^@]+\.[^@]+$' && echo yes || echo NO)"
          echo "  APPLE_PASSWORD matches xxxx-xxxx-xxxx-xxxx: $(printf '%s' "$APPLE_PASSWORD" | grep -qE '^[a-z]{4}(-[a-z]{4}){3}$' && echo yes || echo NO)"
          echo "  APPLE_TEAM_ID is 10 alphanumerics: $(printf '%s' "$APPLE_TEAM_ID" | grep -qE '^[A-Z0-9]{10}$' && echo yes || echo NO)"

      - name: Ask Apple whether the triple is accepted
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          xcrun notarytool history \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" 2>&1 | tail -20
          echo "exit: $?"
