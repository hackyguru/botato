name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The bundle below is the only thing that needs a slow run, and it needs one
  # rarely. Once a week catches the kind of rot that arrives from outside — a
  # Tauri release, a runner image, a system webview — rather than from a commit.
  schedule:
    - cron: "0 6 * * 1"

# A second push to the same branch makes the first run pointless. The event is
# in the key so a Monday bundle and a Monday push do not cancel each other:
# they are the same ref and are not the same question.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # Both, because the two are not the same program: Tauri links against
    # whatever webview the system has, and half of what botcage does with the
    # machine — speaking, opening a terminal, deciding whether it can notify at
    # all — takes a different path on each. Checking only Linux meant the
    # platform most of this runs on was first compiled at release time.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview, so the Rust crate will not even
      # compile without these headers. macOS has its own and needs none.
      - name: System dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file cmake clang libclang-dev \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The version appears in three files and a release that disagrees with
      # itself is worse than a failed build, so it is checked on every push
      # rather than only at tag time.
      - name: Versions agree
        run: node .github/scripts/check-version.mjs

      - name: Typecheck and bundle the frontend
        run: pnpm build

      - name: Desktop interaction tests
        run: pnpm test

      - name: Shared design tokens
        run: python3 scripts/tokens.py --check

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Only the hermetic tests. The rest need the Claude Code CLI, a keychain or
      # a live service, and are run locally with `cargo test -- --ignored`.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The phone app, which had no gate of its own at all. It ships as half of
      # the pairing, the push and the desk, and until now the only thing
      # standing between a broken one and a release was somebody remembering to
      # run tsc. Its own npm lockfile, and only on one leg: TypeScript does not
      # care which machine it runs on.
      - name: Typecheck the phone app
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit

      # Proves the thing a release actually produces, without publishing it —
      # which is a different artefact on each platform, so each leg builds its
      # own. A .deb on macOS is not a slower build, it is a failed one.
      #
      # Not on every push. This is a full Rust compile and a platform bundle,
      # and it runs after every other gate in this job has already answered —
      # so a one-line change waited on it to learn nothing new. Bundling breaks
      # when something outside the commit changes, and release.yml builds it
      # for real before anything ships. Weekly, or on request before a tag.
      #
      # The cost of that: a commit can now break bundling and stay green until
      # Monday. That is the trade, and it is the right way round — CI that
      # answers while you are still at the keyboard is CI somebody reads.
      - name: Bundle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm tauri build --bundles ${{ startsWith(matrix.os, 'ubuntu') && 'deb' || 'app' }}
