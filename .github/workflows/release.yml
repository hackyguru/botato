name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

jobs:
  # Fails in seconds rather than after three platform builds have run.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the version in the app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node .github/scripts/check-version.mjs "$TAG"

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x86-64)
          # Built on an ARM runner rather than cross-compiled: Tauri links
          # against the system webview, so a cross build would need the whole
          # GTK stack for the other architecture and it is cheaper to compile
          # where the headers already are.
          #
          # Not a rare machine. It is Asahi on the same laptops the macOS legs
          # above are for, and every ARM server and single-board machine
          # somebody might leave a bot running on.
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux (ARM64)

    runs-on: ${{ matrix.platform }}
    steps:
      # No explicit ref: checkout already uses the ref that triggered the run —
      # the tag on a tag push, the branch on a manual dispatch. Naming the input
      # tag here made a dispatch try to check out a tag that does not exist yet,
      # which is precisely the case dispatch is for.
      - uses: actions/checkout@v4

      # xdg-utils is the one that is not a build dependency: the AppImage
      # bundler shells out to xdg-mime, and the ARM runner image does not carry
      # it where the x86 one does. Without it the .deb builds, the AppImage
      # does not, and the leg fails after seven minutes of compiling.
      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file cmake clang libclang-dev \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # The action installs a toolchain called "stable". rust-toolchain.toml
      # then tells cargo to use one called "1.98.0" — a separate rustup entry
      # even when the two are the same compiler — so a target added above lands
      # on the toolchain we are not building with. Asking rustup from inside the
      # repo adds it to the one the file names, which is the one that matters.
      - name: The target this leg builds for
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # A secret pasted with a trailing newline is invisible in the UI and fails
      # with a bare 401 that names no field. Trimming here costs nothing and
      # removes a whole class of afternoon.
      - name: Normalise the Apple credentials
        env:
          RAW_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keep () {
            name="$1"; raw="$2"
            [ -n "$raw" ] || return 0
            trimmed="$(printf '%s' "$raw" | tr -d '\r\n')"
            # The trimmed value differs from the stored secret, so it is not
            # masked automatically. Mask it before it can reach a log.
            echo "::add-mask::$trimmed"
            printf '%s=%s\n' "$name" "$trimmed" >> "$GITHUB_ENV"
          }
          keep APPLE_CERTIFICATE "$RAW_CERTIFICATE"
          keep APPLE_CERTIFICATE_PASSWORD "$RAW_CERT_PASSWORD"
          keep APPLE_SIGNING_IDENTITY "$RAW_IDENTITY"
          keep APPLE_ID "$RAW_APPLE_ID"
          keep APPLE_PASSWORD "$RAW_APPLE_PASSWORD"
          keep APPLE_TEAM_ID "$RAW_TEAM_ID"

      # The Apple values come from the environment set above rather than from
      # secrets directly, so the trimmed versions are what get used.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles. Without these the build still succeeds
          # and simply produces no .sig files, which the updater then refuses —
          # so a missing secret shows up as "that did not install" rather than
          # as a failed build. The keypair is not the Apple one; see RELEASING.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signing and notarisation happen only once these exist. Without them
          # the build still succeeds and produces an unsigned bundle, which
          # Gatekeeper will refuse on anyone else's machine — so the release
          # notes below say so rather than letting people find out.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: botcage ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          # Every release is a pre-release. botcage is alpha: the version
          # number is not a promise, and GitHub's "Latest release" badge is —
          # it is the one people download without reading anything else. The
          # in-app update check reads the releases list rather than
          # `releases/latest` precisely so this flag costs nothing.
          prerelease: true
          args: --target ${{ matrix.target }}
          releaseBody: |
            > ## Alpha software, no warranty
            >
            > botcage is in **alpha** and every release is a pre-release. It is
            > provided **as is**, without warranty of any kind — expect bugs,
            > breaking changes between versions, and data that does not survive
            > an upgrade. Bots run commands, spend money against your own API
            > accounts and act while nobody is watching; what they do is your
            > responsibility. Do not point one at anything you cannot afford to
            > lose, break or expose, and keep your own backups.
            >
            > Full terms are shown in the app before first use, and in
            > [the licence](../blob/main/LICENSE).

            ## Which file do I want?

            | You have | Download |
            | --- | --- |
            | Mac, Apple silicon (M1–M4) | `botcage_*_aarch64.dmg` |
            | Mac, Intel | `botcage_*_x64.dmg` |
            | Debian, Ubuntu, Mint | `botcage_*_amd64.deb` |
            | Fedora, RHEL, openSUSE | `botcage-*.x86_64.rpm` |
            | Any other Linux | `botcage_*_amd64.AppImage` |
            | Linux on ARM — a Raspberry Pi, an ARM server, Asahi on a Mac | the same three, `arm64` / `aarch64` |

            Not sure which Mac you have?  → menu → About This Mac. Anything with
            an M-series chip takes the `aarch64` build.

            On Linux, `uname -m` says which you are: `x86_64` takes the amd64
            files, `aarch64` takes the ARM ones.

            ## Before it will run

            botcage needs the **Claude Code CLI** installed and signed in — it
            drives that rather than shipping a model of its own:

            ```sh
            npm install -g @anthropic-ai/claude-code   # then: claude
            ```

            A Claude Pro or Max subscription covers it. Everything else — chat,
            memory, routines, connectors, plugins — works with nothing further.

            ## Giving a bot its own computer

            Optional, and off by default. Switch on **Own computer** in a bot's
            settings and botcage sets up a container engine itself. The Linux
            desktop it runs is built on first use and takes a few minutes.

            ## The phone app

            Not in this release. botcage has an iOS and Android client that
            reaches your laptop directly, but neither ships here — an iPhone
            has no install path for a file attached to a release, and the
            Android build is not something to hand out signed with a debug key.
            Build either from [`mobile/`](../mobile).
