name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

jobs:
  # Fails in seconds rather than after three platform builds have run.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the version in the app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node .github/scripts/check-version.mjs "$TAG"

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.platform }}
    steps:
      # No explicit ref: checkout already uses the ref that triggered the run —
      # the tag on a tag push, the branch on a manual dispatch. Naming the input
      # tag here made a dispatch try to check out a tag that does not exist yet,
      # which is precisely the case dispatch is for.
      - uses: actions/checkout@v4

      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # A secret pasted with a trailing newline is invisible in the UI and fails
      # with a bare 401 that names no field. Trimming here costs nothing and
      # removes a whole class of afternoon.
      - name: Normalise the Apple credentials
        env:
          RAW_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keep () {
            name="$1"; raw="$2"
            [ -n "$raw" ] || return 0
            trimmed="$(printf '%s' "$raw" | tr -d '\r\n')"
            # The trimmed value differs from the stored secret, so it is not
            # masked automatically. Mask it before it can reach a log.
            echo "::add-mask::$trimmed"
            printf '%s=%s\n' "$name" "$trimmed" >> "$GITHUB_ENV"
          }
          keep APPLE_CERTIFICATE "$RAW_CERTIFICATE"
          keep APPLE_CERTIFICATE_PASSWORD "$RAW_CERT_PASSWORD"
          keep APPLE_SIGNING_IDENTITY "$RAW_IDENTITY"
          keep APPLE_ID "$RAW_APPLE_ID"
          keep APPLE_PASSWORD "$RAW_APPLE_PASSWORD"
          keep APPLE_TEAM_ID "$RAW_TEAM_ID"

      # The Apple values come from the environment set above rather than from
      # secrets directly, so the trimmed versions are what get used.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarisation happen only once these exist. Without them
          # the build still succeeds and produces an unsigned bundle, which
          # Gatekeeper will refuse on anyone else's machine — so the release
          # notes below say so rather than letting people find out.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: botcage ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          releaseBody: |
            ## Which file do I want?

            | You have | Download |
            | --- | --- |
            | Mac, Apple silicon (M1–M4) | `botcage_*_aarch64.dmg` |
            | Mac, Intel | `botcage_*_x64.dmg` |
            | Debian, Ubuntu, Mint | `botcage_*_amd64.deb` |
            | Fedora, RHEL, openSUSE | `botcage-*.x86_64.rpm` |
            | Any other Linux | `botcage_*_amd64.AppImage` |

            Not sure which Mac you have?  → menu → About This Mac. Anything with
            an M-series chip takes the `aarch64` build.

            ## Before it will run

            botcage needs the **Claude Code CLI** installed and signed in — it
            drives that rather than shipping a model of its own:

            ```sh
            npm install -g @anthropic-ai/claude-code   # then: claude
            ```

            A Claude Pro or Max subscription covers it. Everything else — chat,
            memory, routines, connectors, plugins — works with nothing further.

            ## Giving a bot its own computer

            Optional, and off by default. Switch on **Own computer** in a bot's
            settings and botcage sets up a container engine itself. The Linux
            desktop it runs is built on first use and takes a few minutes.

            ## The phone app

            `botcage-*.apk` is the Android client. It pairs by scanning the
            square the laptop shows and reaches it directly over an encrypted
            peer-to-peer connection — no account, no port to open, nothing of
            ours in between. Android will ask you to allow an install from
            outside the Play Store.

            **iOS is not here, and cannot be.** Apple has no install path for a
            binary attached to a release: an app has to come from the App Store
            or TestFlight, or be signed with your own developer account. Build
            it yourself from [`mobile/`](../mobile) — the README there is the
            whole procedure.

  # The Android client. After the desktop builds, because it attaches to the
  # draft release those create — and because a phone app is no use without the
  # laptop it talks to.
  android:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/rust/botcage-p2p
          key: android

      - run: cargo install cargo-ndk --locked

      # Speaking QUIC is native code, so the app cannot be built from
      # JavaScript alone: this produces the library for each Android ABI and
      # the Kotlin bindings that match it.
      - name: The peer-to-peer library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash mobile/rust/build.sh android

      - name: The app
        working-directory: mobile
        run: |
          pnpm install --frozen-lockfile
          npx expo prebuild -p android --no-install

      - name: Build it
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # Named for the version rather than app-release.apk, which says nothing
      # once it is sitting in someone's downloads folder.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          apk="$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$apk" ] || { echo "no apk was produced"; exit 1; }
          cp "$apk" "botcage-${TAG#v}.apk"
          gh release upload "$TAG" "botcage-${TAG#v}.apk" --clobber
