<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>botcage</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
      </symbol>
      <symbol id="i-plug" viewBox="0 0 24 24">
        <path d="M12 22v-5" />
        <path d="M9 8V2M15 8V2" />
        <path d="M18 8v3a6 6 0 0 1-12 0V8Z" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 6v9m0 0 3.5-3.5M12 15l-3.5-3.5" />
        <circle cx="12" cy="12" r="9.5" />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <path d="M8 21h8M12 17v4" />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v3" />
      </symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="19" cy="12" r="1.4" />
      </symbol>
      <symbol id="i-reply" viewBox="0 0 24 24">
        <path d="M14 4h-4a7 7 0 0 0 0 14h9" /><path d="m15 14 4 4-4 4" />
      </symbol>
      <symbol id="i-smile" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M8.5 14a4.5 4.5 0 0 0 7 0" /><path d="M9 9.5h.01M15 9.5h.01" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="14" height="14" rx="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.8 9.8 0 0 0-6.7 2.7L3 8" /><path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-power" viewBox="0 0 24 24">
        <path d="M12 3v9" /><path d="M6.3 6.3a8 8 0 1 0 11.4 0" />
      </symbol>
      <symbol id="i-hand" viewBox="0 0 24 24">
        <path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11" />
        <path d="M15 10.5V4.5a1.5 1.5 0 0 0-3 0V11" />
        <path d="M12 11V6.5a1.5 1.5 0 0 0-3 0V15" />
        <path d="M9 12.5V11a1.5 1.5 0 0 0-3 0v3a7 7 0 0 0 14 0v-3" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M9.5 3v18" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" />
      </symbol>
      <symbol id="i-cube" viewBox="0 0 24 24">
        <path d="M12 2.7 20.5 7.4v9.2L12 21.3 3.5 16.6V7.4z" />
        <path d="M3.5 7.4 12 12l8.5-4.6M12 12v9.3" />
      </symbol>
      <symbol id="i-record" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
      </symbol>
    </svg>

    <div class="app">
      <aside class="sidebar" data-tauri-drag-region>
        <div class="sidebar__head" data-tauri-drag-region="deep">
          <button class="icon-btn" id="btn-rail" title="Collapse sidebar  (⌘B)" aria-label="Collapse sidebar">
            <svg><use href="#i-sidebar" /></svg>
          </button>
          <button class="icon-btn" id="btn-new" title="New bot  (⌘N)" aria-label="New bot">
            <svg><use href="#i-plus" /></svg>
          </button>
        </div>

        <div class="field">
          <svg><use href="#i-search" /></svg>
          <input id="search" placeholder="Search" spellcheck="false" />
        </div>

        <div class="bots" id="bots"></div>

        <div class="sidebar__foot">
          <button class="foot-row" id="btn-plugins">
            <span class="foot-icon"><svg><use href="#i-plug" /></svg></span>
            <span class="foot-label">Plugins</span>
          </button>
          <button class="foot-row" id="btn-account">
            <span class="foot-avatar">G</span>
            <span class="foot-label">guru (priv/acc)</span>
            <span class="badge" title="Update available"><svg><use href="#i-download" /></svg></span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" data-tauri-drag-region="deep">
          <div class="topbar__id" id="topbar-id"></div>
          <div class="topbar__actions">
          <button class="icon-btn" id="btn-settings" title="Bot settings" aria-label="Bot settings">
            <svg><use href="#i-gear" /></svg>
          </button>
          <button class="icon-btn" id="btn-monitor" title="Its computer" aria-label="Its computer">
            <svg><use href="#i-monitor" /></svg>
          </button>
          </div>
        </header>

        <div class="scroll" id="scroll">
          <section class="thread" id="thread"></section>
        </div>

        <div class="dock">
          <form class="composer" id="composer">
            <button type="button" class="add" id="btn-attach" aria-label="Attach">
              <svg><use href="#i-plus" /></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Message" spellcheck="false"></textarea>
            <button type="submit" class="mic" id="btn-send" aria-label="Send">
              <svg><use href="#i-mic" id="send-icon" /></svg>
            </button>
          </form>
        </div>
      </main>
        <aside class="screen-pane" id="screen-pane" hidden>
          <div class="screen-pane__grip" id="screen-grip" title="Drag to resize"></div>
          <header class="screen__head" data-tauri-drag-region="deep">
            <div class="screen__id" id="screen-id"></div>
            <span class="state-pill" id="screen-state">Checking…</span>
            <div class="screen__actions">
              <input class="teach-name" id="teach-name" placeholder="What are you teaching?"
                     spellcheck="false" maxlength="48" hidden />
              <button type="button" class="chip" id="btn-teach" hidden>
                <svg><use href="#i-record" /></svg><span id="btn-teach-label">Teach a task</span>
              </button>
              <button type="button" class="chip" id="btn-control">
                <svg><use href="#i-eye" /></svg><span id="btn-control-label">View only</span>
              </button>
              <button type="button" class="icon-btn" id="btn-screen-power" title="Stop desktop">
                <svg><use href="#i-power" /></svg>
              </button>
              <button type="button" class="icon-btn" id="btn-screen-close" title="Hide  (Esc)">
                <svg><use href="#i-x" /></svg>
              </button>
            </div>
          </header>
          <div class="screen__body">
            <div class="screen__canvas" id="screen-canvas"></div>
            <div class="screen__idle" id="screen-idle">
              <p id="screen-message">Checking for Docker…</p>
              <button type="button" class="btn-primary" id="btn-screen-start" hidden>Start desktop</button>
              <pre class="screen__log" id="screen-log" hidden></pre>
            </div>
          </div>
        </aside>
    </div>

    <div class="menu" id="menu" hidden></div>

    <div class="overlay" id="sheet-wrap" hidden>
      <form class="sheet" id="sheet">
        <div class="sheet__head">
          <h2 id="sheet-title">New bot</h2>
          <button type="button" class="icon-btn icon-btn--sm" id="sheet-close" aria-label="Close">
            <svg><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="sheet__body">
          <div class="sheet__preview" id="sheet-preview"></div>
          <input id="sheet-name" placeholder="Name, e.g. Engineer" spellcheck="false" />
          <input id="sheet-role" placeholder="What it does (optional)" spellcheck="false" />
          <div class="swatches" id="swatches"></div>

          <div class="settings">
            <label class="setting">
              <span class="setting__label">Own computer
                <span class="setting__hint">A private Linux desktop it can switch on when a task needs one.</span>
              </span>
              <input type="checkbox" id="sheet-computer" class="switch" />
            </label>

            <label class="setting">
              <span class="setting__label">Network
                <span class="setting__hint">What that desktop can reach.</span>
              </span>
              <select id="sheet-network" class="picker">
                <option value="full">Internet + your LAN</option>
                <option value="no-lan">Internet only</option>
                <option value="offline">Offline</option>
              </select>
            </label>

            <label class="setting">
              <span class="setting__label">Model
                <span class="setting__hint">Sonnet is easier on your usage limits.</span>
              </span>
              <select id="sheet-model" class="picker">
                <option value="opus">Opus</option>
                <option value="sonnet">Sonnet</option>
              </select>
            </label>
          </div>
        </div>
        <div class="sheet__foot">
          <button type="submit" class="btn-primary" id="sheet-submit">Create bot</button>
        </div>
      </form>
    </div>


    <div class="toast" id="toast" hidden></div>
  </body>
</html>
